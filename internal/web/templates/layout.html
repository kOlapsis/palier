{{define "layout"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palier</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2318212b'/%3E%3Cpath d='M4 19h5v-5h5V9h5V5' fill='none' stroke='%2379afdc' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
{{block "head" .}}{{end}}
<style>
:root {
  --ink: #18212b; --paper: #eef1f4; --surface: #fff; --line: #d5dce3; --soft: #f5f7f9; --muted: #5e6b78;
  --accent: #1d5c8c; --accent-soft: #e3edf6; --ok: #2e7d4f; --ok-soft: #e4f2e9; --warn: #9a620f; --warn-soft: #fbf0dc;
  --bad: #b4342d; --bad-soft: #fbe6e4; --idle: #6c7a88; --idle-soft: #edf0f3; --rail: #18212b; --rail-ink: #c9d3dc;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e3e8ed; --paper: #12171d; --surface: #1a2129; --line: #2c3640; --soft: #151b22; --muted: #95a2af;
    --accent: #79afdc; --accent-soft: #1d3346; --ok: #6cc28f; --ok-soft: #173225; --warn: #e3ac55; --warn-soft: #36290f;
    --bad: #f08a82; --bad-soft: #3d1c1a; --idle: #9aa7b4; --idle-soft: #232c35; --rail: #0d1116; --rail-ink: #9fadba;
  }
}
* { box-sizing: border-box; }
html { font: 15px/1.55 var(--sans); color: var(--ink); background: var(--paper); font-variant-numeric: tabular-nums; }
body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: 14.5rem 1fr; background: linear-gradient(to right, var(--rail) 14.5rem, transparent 14.5rem); }
a { color: var(--accent); text-underline-offset: .18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.rail { background: var(--rail); color: var(--rail-ink); padding: 1.4rem 1rem; display: flex; flex-direction: column; gap: 2rem; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: .6rem; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; padding: 0 .5rem; }
.brand svg { width: 1.6rem; height: 1.6rem; flex: none; }
.rail nav { display: grid; gap: .15rem; }
.rail nav a { color: var(--rail-ink); text-decoration: none; padding: .45rem .6rem; border-radius: 6px; font-weight: 500; }
.rail nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.on-stacks .rail nav a[href="/"], .on-settings .rail nav a[href="/settings"] { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 3px 0 0 #79afdc; }
.rail p { margin: auto 0 0; padding: 0 .6rem; font-size: .8rem; line-height: 1.4; }

main { padding: 2rem clamp(1rem, 3vw, 2.75rem) 4rem; min-width: 0; max-width: 78rem; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1rem; margin-bottom: 1.5rem; }
.head h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }
.head .meta { flex-basis: 100%; color: var(--muted); margin: 0; }
h2 { font-size: 1.15rem; letter-spacing: -.01em; margin: 2.25rem 0 .75rem; }
.muted { color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: .86em; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 600; font-size: .82rem; color: var(--muted); padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--soft); white-space: nowrap; }
td { padding: .8rem 1rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.name a { font-weight: 600; color: var(--ink); text-decoration: none; }
td.name a:hover { color: var(--accent); }
.sub { display: block; color: var(--muted); font-size: .82rem; }
td .sub.mono { white-space: nowrap; }
th.paths { width: 42%; }

.pill { display: inline-flex; align-items: center; gap: .4rem; padding: .12rem .6rem; border-radius: 999px; font-size: .82rem; font-weight: 600; white-space: nowrap; background: var(--idle-soft); color: var(--idle); }
.pill::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.run { background: var(--accent-soft); color: var(--accent); }
.pill.run::before { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }


.notice { border-radius: 8px; padding: .75rem 1rem; margin: 0 0 1rem; border: 1px solid; }
.notice.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); color: var(--bad); }
.notice.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.notice ul { margin: .4rem 0 0; padding-left: 1.2rem; }

.path { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; row-gap: .45rem; }
.path li { display: flex; align-items: center; }
.path li + li::before { --c: var(--muted); content: ""; width: .9rem; height: .5rem; margin: 0 .3rem; opacity: .7;
  background: linear-gradient(var(--c), var(--c)) left bottom / 50% 1.5px no-repeat, linear-gradient(var(--c), var(--c)) center / 1.5px 100% no-repeat, linear-gradient(var(--c), var(--c)) right top / 50% 1.5px no-repeat; }
.path span { font-family: var(--mono); font-size: .8rem; padding: .15rem .5rem; border-radius: 5px; border: 1px solid var(--line); background: var(--soft); white-space: nowrap; }
.path .from span { background: transparent; color: var(--muted); border-style: dashed; }
.path .stop span { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.path .last span { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.legend { font-size: .8rem; color: var(--muted); margin: .5rem 0 0; }
.legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 3px; border: 1px solid var(--accent); background: var(--accent-soft); vertical-align: -.05rem; margin-right: .25rem; }
details.versions { margin-top: .4rem; font-size: .8rem; color: var(--muted); }
details.versions summary { cursor: pointer; width: max-content; }
details.versions p { margin: .3rem 0 0; font-family: var(--mono); line-height: 1.7; max-width: 38rem; }
.flag { display: block; margin-top: .35rem; font-size: .8rem; }
.flag.bad { color: var(--bad); }

.planhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; margin: 2.25rem 0 1rem; }
.planhead h2 { margin: 0; }
.planhead p { margin: .15rem 0 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
form { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; border-radius: 7px; padding: .5rem .95rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.primary:hover { filter: brightness(1.08); }
button.small { padding: .25rem .6rem; font-size: .82rem; font-weight: 500; }
input[type=date], input[type=password] { padding: .45rem .6rem; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); }

ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
ol.steps > li { position: relative; padding: 0 0 1.25rem 3rem; counter-increment: step; }
ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: .9rem; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent); z-index: 1; }
ol.steps > li:not(:last-child)::after { content: ""; position: absolute; left: calc(1rem - 1px); top: 2.9rem; bottom: 0; border-left: 2px solid var(--line); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; }
.step header { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.step header strong { font-size: 1rem; margin-right: .25rem; }
.step p { margin: .6rem 0 0; }
.changes { margin: .75rem 0 0; padding: 0; list-style: none; display: grid; gap: .25rem; }
.changes code { background: var(--soft); border: 1px solid var(--line); padding: .05rem .4rem; border-radius: 4px; }
.ops { margin: .75rem 0 0; padding-left: 1.3rem; font-family: var(--mono); font-size: .82rem; color: var(--muted); }
.ops li { padding: .1rem 0; }
.step details { margin-top: .75rem; border-top: 1px solid var(--line); padding-top: .6rem; }
.step summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.fact { margin: .75rem 0 0; }
.fact > div { font-size: .85rem; }
blockquote { margin: .35rem 0 0; padding: .5rem .8rem; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 6px 6px 0; white-space: pre-wrap; font-size: .9rem; max-width: 72ch; }
.decide { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center; margin-top: .5rem; padding: 1rem 1.25rem; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.decide label { display: inline-flex; gap: .5rem; align-items: center; }

.log td:first-child { white-space: nowrap; color: var(--muted); font-size: .85rem; width: 1%; }
.log pre { margin: 0; font-family: var(--mono); font-size: .82rem; white-space: pre-wrap; word-break: break-word; }
pre.error { margin: 0 0 1.25rem; padding: .9rem 1rem; background: var(--bad-soft); color: var(--bad); border-radius: 8px; font-family: var(--mono); font-size: .85rem; white-space: pre-wrap; }

dl.settings { display: grid; grid-template-columns: minmax(12rem, max-content) 1fr; margin: 0; }
dl.settings dt, dl.settings dd { margin: 0; padding: .7rem 1rem; border-bottom: 1px solid var(--line); }
dl.settings dt { font-family: var(--mono); font-size: .85rem; color: var(--muted); }
dl.settings > :nth-last-child(-n+2) { border-bottom: 0; }

.on-login { grid-template-columns: 1fr; place-items: center; background: var(--rail); }
.on-login .rail { display: none; }
.gate { background: var(--surface); border-radius: 12px; padding: 2rem; width: min(24rem, 92vw); display: grid; gap: 1rem; }
.gate .brand { color: var(--ink); padding: 0; }
.gate label { font-weight: 600; font-size: .9rem; }
.gate input { width: 100%; margin-top: .35rem; }
.gate p { margin: 0; }
.empty { padding: 2.5rem 1.5rem; text-align: center; color: var(--muted); }

@media (max-width: 52rem) {
  body { grid-template-columns: 1fr; background: none; }
  .rail { position: static; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: .8rem 1rem; gap: 1rem; }
  .rail nav { display: flex; }
  .rail p { display: none; }
  ol.steps > li { padding-left: 2.5rem; }
  dl.settings { grid-template-columns: 1fr; }
  dl.settings dt { border-bottom: 0; padding-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { .pill.run::before { animation: none; } }
</style>
</head>
<body class="on-{{block "section" .}}stacks{{end}}">
<aside class="rail">
<a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h5v-5h5v-5h5V5h3"/><path d="M3 20h18" opacity=".35"/></svg>Palier</a>
<nav aria-label="Navigation"><a href="/">Stacks</a><a href="/settings">Réglages</a></nav>
<p>Mises à jour Docker Compose par paliers, avec point de reprise.</p>
</aside>
<main>{{template "content" .}}</main>
</body>
</html>
{{end}}
