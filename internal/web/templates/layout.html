{{define "layout"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palier</title>
{{block "head" .}}{{end}}
<style>
body { font: 16px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; color: #1a1a1a; background: #fff; }
header { border-bottom: 1px solid #ddd; margin-bottom: 1rem; }
header a { color: inherit; text-decoration: none; font-weight: 600; }
.error { color: #b00020; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: .3rem .5rem; border-bottom: 1px solid #ddd; }
.muted { color: #666; }
@media (prefers-color-scheme: dark) { body { color: #e6e6e6; background: #141414; } header, th, td { border-color: #333; } .muted { color: #999; } .error { color: #ff7a8a; } }
</style>
</head>
<body>
<header><p><a href="/">Palier</a></p></header>
<main>{{template "content" .}}</main>
</body>
</html>
{{end}}
