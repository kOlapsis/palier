<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Palier: Docker Compose updates in verified steps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121c3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stepFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#121c3a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <style>
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono, .ver { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .ver { font-size: 15px; fill: #aab4cc; }
      .target { fill: #3ddc97; font-weight: 700; }
    </style>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="560" rx="24" fill="url(#glow)"/>

  <g class="sans">
    <text x="72" y="150" font-size="96" font-weight="800" fill="#f2f5fb" letter-spacing="-3">Palier</text>
    <rect x="76" y="176" width="64" height="5" rx="2.5" fill="#3ddc97"/>
    <text x="72" y="236" font-size="30" font-weight="600" fill="#e3e8f3">Your Docker Compose stacks,</text>
    <text x="72" y="274" font-size="30" font-weight="600" fill="#e3e8f3">updated step by step.</text>
    <text x="72" y="326" font-size="18" fill="#8d97b0">It reads the release notes, has an AI plan</text>
    <text x="72" y="352" font-size="18" fill="#8d97b0">the upgrade, verifies each step with Docker and</text>
    <text x="72" y="378" font-size="18" fill="#8d97b0">goes back to the last good step if something breaks.</text>
  </g>
  <g class="mono" font-size="14">
    <rect x="72" y="420" width="226" height="34" rx="17" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.45"/>
    <text x="185" y="442" text-anchor="middle" fill="#3ddc97">one Go binary, one container</text>
    <rect x="310" y="420" width="250" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="435" y="442" text-anchor="middle" fill="#aab4cc">automatic rollback</text>
  </g>

  <path d="M590 500 L590 440 L684 440 L684 394 L778 394 L778 348 L872 348 L872 302 L966 302 L966 256 L1060 256 L1060 210 L1154 210 L1154 164 L1248 164" fill="none" stroke="#2c3b66" stroke-width="1.5"/>
  <rect x="590" y="440" width="94" height="60" fill="url(#stepFill)"/><line x1="590" y1="440" x2="684" y2="440" stroke="#5b6b8f" stroke-width="3"/><rect x="684" y="394" width="94" height="106" fill="url(#stepFill)"/><line x1="684" y1="394" x2="778" y2="394" stroke="#5b6b8f" stroke-width="3"/><rect x="778" y="348" width="94" height="152" fill="url(#stepFill)"/><line x1="778" y1="348" x2="872" y2="348" stroke="#5b6b8f" stroke-width="3"/><rect x="872" y="302" width="94" height="198" fill="url(#stepFill)"/><line x1="872" y1="302" x2="966" y2="302" stroke="#5b6b8f" stroke-width="3"/><rect x="966" y="256" width="94" height="244" fill="url(#stepFill)"/><line x1="966" y1="256" x2="1060" y2="256" stroke="#5b6b8f" stroke-width="3"/><rect x="1060" y="210" width="94" height="290" fill="url(#stepFill)"/><line x1="1060" y1="210" x2="1154" y2="210" stroke="#5b6b8f" stroke-width="3"/><rect x="1154" y="164" width="94" height="336" fill="url(#stepFill)"/><line x1="1154" y1="164" x2="1248" y2="164" stroke="#3ddc97" stroke-width="3"/>
  <path d="M637.0 378.0 C 677.0 70, 863.0 50, 1001.0 92" fill="none" stroke="#ff5d6c" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
  <circle cx="1013.0" cy="96" r="13" fill="#ff5d6c" fill-opacity="0.15" stroke="#ff5d6c" stroke-width="2"/>
  <path d="M1008.0 91 l10 10 M1018.0 91 l-10 10" stroke="#ff5d6c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1037.0" y="92" class="mono" font-size="14" fill="#ff8a95">16.1.6 → 17.0.1 directly</text>
  <text x="1037.0" y="112" class="sans" font-size="14" fill="#8d97b0">refused: required stops</text>
  <circle cx="637.0" cy="428" r="9" fill="#3ddc97" opacity="0.85"/><path d="M633.0 428 l3 3 l5 -6" stroke="#0b1226" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="731.0" cy="382" r="9" fill="#3ddc97" opacity="0.85"/><path d="M727.0 382 l3 3 l5 -6" stroke="#0b1226" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="825.0" cy="336" r="9" fill="#3ddc97" opacity="0.85"/><path d="M821.0 336 l3 3 l5 -6" stroke="#0b1226" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="919.0" cy="290" r="9" fill="#3ddc97" opacity="0.85"/><path d="M915.0 290 l3 3 l5 -6" stroke="#0b1226" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1013.0" cy="244" r="9" fill="#3ddc97" opacity="0.85"/><path d="M1009.0 244 l3 3 l5 -6" stroke="#0b1226" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1107.0" cy="198" r="9" fill="#3ddc97" opacity="0.85"/><path d="M1103.0 198 l3 3 l5 -6" stroke="#0b1226" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1201.0" cy="152" r="9" fill="#3ddc97" opacity="1"/><path d="M1197.0 152 l3 3 l5 -6" stroke="#0b1226" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="637.0" y="410" class="ver" text-anchor="middle">16.1.6</text><text x="731.0" y="364" class="ver" text-anchor="middle">16.3.9</text><text x="825.0" y="318" class="ver" text-anchor="middle">16.7.10</text><text x="919.0" y="272" class="ver" text-anchor="middle">16.11.10</text><text x="1013.0" y="226" class="ver" text-anchor="middle">17.3.7</text><text x="1107.0" y="180" class="ver" text-anchor="middle">18.8.11</text><text x="1201.0" y="134" class="ver target" text-anchor="middle">19.5.1</text>
  <text x="590" y="534" class="sans" font-size="14" fill="#6f7a96">GitLab CE on the bench: 13 verified steps, 3 h 43, unattended</text>
</svg>
