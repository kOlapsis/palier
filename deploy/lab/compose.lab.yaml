# Bench override of ../compose.yaml; relative paths resolve from deploy/, the
# directory of the first file. Values come from the --env-file of palier_stack.
services:
  palier:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PALIER_LISTEN: ":8080"
      PALIER_OIDC_ISSUER: ${LAB_OIDC_ISSUER:?}
      PALIER_OIDC_CLIENT_ID: palier
      PALIER_OIDC_CLIENT_SECRET: lab-secret
      PALIER_OIDC_ADMINS: palier-admins
      PALIER_SMTP_HOST: mailpit
      PALIER_SMTP_PORT: "1025"
      PALIER_SMTP_FROM: palier@lab.test
      PALIER_EMAIL_TO: benjamin@lab.test
      PALIER_PUBLIC_URL: ${LAB_PUBLIC_URL:?}
      PALIER_REGISTRY_WEBHOOK_SECRET: 0b5d6f1c9a7e4d2b8f3a6c1e9d7b5a3f2e8c4a6b1d9f7e3c5a2b8d6f4e1c9a7b
      DOCKER_index_docker_io_USR: ${LAB_DOCKERHUB_USR:-}
      DOCKER_index_docker_io_PSW: ${LAB_DOCKERHUB_PSW:-}
      DOCKER_10_10_50_10_USR: palier
      DOCKER_10_10_50_10_PSW: lab-registry-password
      SSL_CERT_DIR: /etc/palier/ca
      DOCKER_CONFIG: /etc/palier/docker
      PALIER_AI_KEY: ${PALIER_AI_KEY:-}
      PALIER_GITLAB_TOKEN: ${PALIER_GITLAB_TOKEN:-}
      PALIER_GITHUB_TOKEN: ${PALIER_GITHUB_TOKEN:-}
      PALIER_REGISTRY_MIRROR: mirror.gcr.io
      PALIER_WEBHOOK_URL: http://webhook-tester:8080/00000000-0000-4000-8000-000000000001
      PALIER_WEBHOOK_SECRET: lab-webhook-secret
      PALIER_NTFY_URL: ${LAB_NTFY_URL:-https://ntfy.sh/palier-lab-0df9d9ef06cb}
      PALIER_SLACK_URL: ${LAB_SLACK_URL:-http://webhook-tester:8080/00000000-0000-4000-8000-000000000002}
      PALIER_DISCORD_URL: ${LAB_DISCORD_URL:-http://webhook-tester:8080/00000000-0000-4000-8000-000000000003}
      PALIER_TELEGRAM_URL: ${LAB_TELEGRAM_URL:-http://webhook-tester:8080/00000000-0000-4000-8000-000000000004/sendMessage?chat_id=1}
      PALIER_BACKUP_TO: minio:palier
      PALIER_BACKUP_KEEP: "3"
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://${LAB_ADDRESS:?}:${LAB_MINIO_PORT:?}
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: palier
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: lab-minio-password
      RCLONE_CONFIG_SFTP_TYPE: sftp
      RCLONE_CONFIG_SFTP_HOST: ${LAB_ADDRESS:?}
      RCLONE_CONFIG_SFTP_PORT: ${LAB_SFTP_PORT:?}
      RCLONE_CONFIG_SFTP_USER: palier
      RCLONE_CONFIG_SFTP_PASS: Lrx0JAiJow7v_jI3ygeAymjwzPTj5bJfU6E9I2Xkqb50
    ports: !override
      - "${LAB_PALIER_PORT:?}:8080"
    volumes:
      - /apps:/apps
      - /opt/palier/docker:/etc/palier/docker:ro
      - /opt/palier/bin/docker-credential-env:/usr/local/bin/docker-credential-env:ro
      - /opt/palier/labreg/ca:/etc/palier/ca:ro

  webhook-tester:
    image: ghcr.io/tarampampam/webhook-tester:2
    restart: unless-stopped
    environment:
      AUTO_CREATE_SESSIONS: "true"
    ports:
      - "${LAB_WEBHOOK_TESTER_PORT:?}:8080"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    restart: unless-stopped
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "${LAB_OIDC_PORT:?}:8080"

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "${LAB_MAILPIT_PORT:?}:8025"

  labreg:
    image: registry:2.8.3
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/server.pem
      REGISTRY_HTTP_TLS_KEY: /certs/server-key.pem
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: https://${LAB_ADDRESS:?}:${LAB_LABAUTH_PORT:?}/auth
      REGISTRY_AUTH_TOKEN_SERVICE: palier-lab-registry
      REGISTRY_AUTH_TOKEN_ISSUER: palier-lab
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /certs/token.pem
    volumes:
      - /opt/palier/labreg/certs:/certs:ro
      - labreg-data:/var/lib/registry
    ports:
      - "${LAB_LABREG_PORT:?}:5000"

  labauth:
    image: cesanta/docker_auth:1.14.0
    restart: unless-stopped
    command: ["--v=2", "--alsologtostderr", "/config/auth.yml"]
    volumes:
      - /opt/palier/labreg/certs:/certs:ro
      - /opt/palier/labreg/auth.yml:/config/auth.yml:ro
    ports:
      - "${LAB_LABAUTH_PORT:?}:5001"

  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: palier
      MINIO_ROOT_PASSWORD: lab-minio-password
    volumes:
      - minio-data:/data
    ports:
      - "${LAB_MINIO_PORT:?}:9000"

  sftp:
    image: docker.io/atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
    restart: unless-stopped
    command: ["palier:lab-sftp-password:1001:1001:backups"]
    volumes:
      - /opt/palier/sftp:/home/palier/backups
    ports:
      - "${LAB_SFTP_PORT:?}:22"

  ollama:
    image: ollama/ollama:0.40.15
    profiles: [ai-local]
    environment:
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama

volumes:
  labreg-data: {}
  minio-data: {}
  ollama-models: {}
