# Bench override of ../compose.yaml; relative paths resolve from deploy/, the
# directory of the first file. Values come from the --env-file of palier_stack.
services:
  palier:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PALIER_TOKEN: ${PALIER_TOKEN:?}
      DOCKER_CONFIG: /etc/palier/docker
      PALIER_AI_KEY: ${PALIER_AI_KEY:-}
      PALIER_AUTO: patch
      PALIER_WEBHOOK_URL: http://webhook-tester:8080/00000000-0000-4000-8000-000000000001
    ports: !override
      - "${LAB_PALIER_PORT:?}:8080"
    volumes:
      - /apps:/apps
      - /opt/palier/docker:/etc/palier/docker:ro

  webhook-tester:
    image: ghcr.io/tarampampam/webhook-tester:2
    restart: unless-stopped
    environment:
      AUTO_CREATE_SESSIONS: "true"
    ports:
      - "${LAB_WEBHOOK_TESTER_PORT:?}:8080"
