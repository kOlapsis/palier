---
palier_dir: /opt/palier
palier_src: "{{ palier_dir }}/src"
palier_repo: "{{ playbook_dir }}/../.."
palier_compose: >-
  docker compose --env-file {{ palier_dir }}/compose.env
  -f {{ palier_src }}/deploy/compose.yaml
  -f {{ palier_src }}/deploy/lab/compose.lab.yaml
palier_registries:
  - address: https://index.docker.io/v1/
    user: "{{ lookup('env', 'DOCKERHUB_USERNAME') }}"
    password: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"
  - address: "{{ lookup('env', 'REGISTRY_ADDRESS') }}"
    user: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
    password: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"
