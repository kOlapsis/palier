---
- name: Create the Palier directory
  ansible.builtin.file:
    path: "{{ palier_dir }}"
    state: directory
    mode: "0755"

- name: Copy the working copy to the machine
  ansible.posix.synchronize:
    src: "{{ palier_repo }}/"
    dest: "{{ palier_src }}/"
    delete: true
    rsync_opts:
      - --omit-dir-times
      - --exclude=.env*
      - --exclude=/deploy/lab/lab.env
      - --include=/go.mod
      - --include=/go.sum
      - --include=/cmd/***
      - --include=/internal/***
      - --include=/deploy/***
      - --exclude=*

- name: Read the group of the Docker socket
  ansible.builtin.command: stat -c %g /var/run/docker.sock
  register: palier_docker_gid
  changed_when: false

- name: Write the values the override reads
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ palier_dir }}/compose.env"
    mode: "0600"
  no_log: true

- name: Download the credential helper docker-credential-env
  ansible.builtin.get_url:
    url: https://github.com/isometry/docker-credential-env/releases/download/v1.7.0/docker-credential-env_1.7.0_linux_amd64.zip
    checksum: sha256:https://github.com/isometry/docker-credential-env/releases/download/v1.7.0/docker-credential-env_1.7.0_SHA256SUMS
    dest: "{{ palier_dir }}/docker-credential-env.zip"
    mode: "0644"

- name: Unpack the credential helper
  ansible.builtin.shell: |
    mkdir -p {{ palier_dir }}/bin
    python3 -c 'import zipfile, sys; zipfile.ZipFile(sys.argv[1]).extract("docker-credential-env", sys.argv[2])' {{ palier_dir }}/docker-credential-env.zip {{ palier_dir }}/bin
    chmod 0755 {{ palier_dir }}/bin/docker-credential-env
  args:
    creates: "{{ palier_dir }}/bin/docker-credential-env"

- name: Create the certificates of the lab registry once
  ansible.builtin.shell: |
    set -e
    d={{ palier_dir }}/labreg
    mkdir -p $d/certs $d/ca
    cd $d/certs
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=palier lab CA" -keyout ca-key.pem -out ca.pem
    openssl req -newkey rsa:2048 -nodes -subj "/CN={{ topology.vm.address }}" -keyout server-key.pem -out server.csr
    printf 'subjectAltName=IP:{{ topology.vm.address }}\n' > san.ext
    openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial -days 3650 -extfile san.ext -out server.pem
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=palier lab token" -keyout token-key.pem -out token.pem
    chmod 0644 *.pem
    cp ca.pem $d/ca/palier-lab-ca.crt
  args:
    creates: "{{ palier_dir }}/labreg/certs/server.pem"

- name: Let the Docker engine trust the lab registry
  ansible.builtin.shell: |
    mkdir -p /etc/docker/certs.d/{{ topology.vm.address }}:{{ topology.ports.labreg }}
    cp {{ palier_dir }}/labreg/certs/ca.pem /etc/docker/certs.d/{{ topology.vm.address }}:{{ topology.ports.labreg }}/ca.crt
  args:
    creates: /etc/docker/certs.d/{{ topology.vm.address }}:{{ topology.ports.labreg }}/ca.crt

- name: Write the users of the lab registry token server
  ansible.builtin.shell: |
    set -e
    hash=$(docker run --rm httpd:2.4 htpasswd -nbB palier lab-registry-password | cut -d: -f2)
    cat > {{ palier_dir }}/labreg/auth.yml <<EOF
    server:
      addr: ":5001"
      certificate: /certs/server.pem
      key: /certs/server-key.pem
    token:
      issuer: palier-lab
      expiration: 900
      certificate: /certs/token.pem
      key: /certs/token-key.pem
    users:
      "palier":
        password: "$hash"
    acl:
      - match: {account: "palier"}
        actions: ["*"]
    EOF
    chmod 0644 {{ palier_dir }}/labreg/auth.yml
  args:
    creates: "{{ palier_dir }}/labreg/auth.yml"

- name: Create the Docker configuration directory of Palier
  ansible.builtin.file:
    path: "{{ palier_dir }}/docker"
    state: directory
    owner: "65532"
    group: "65532"
    mode: "0700"

- name: Give Palier the registry credentials of lab.env
  ansible.builtin.template:
    src: docker-config.json.j2
    dest: "{{ palier_dir }}/docker/config.json"
    owner: "65532"
    group: "65532"
    mode: "0400"
  no_log: true

- name: Create the directory of the SFTP server, owned by its palier user
  ansible.builtin.file:
    path: "{{ palier_dir }}/sftp"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "0755"

- name: Create /apps
  ansible.builtin.file:
    path: /apps
    state: directory
    mode: "0755"

- name: Read the layers of the image built last time
  ansible.builtin.command: docker image inspect --format '{{ '{{' }}json .RootFS.Layers{{ '}}' }}' palier:local
  register: palier_image_before
  changed_when: false
  failed_when: false

- name: Build Palier from the working copy
  ansible.builtin.command: "{{ palier_compose }} build palier"
  register: palier_build
  until: palier_build.rc == 0
  retries: 3
  delay: 30
  changed_when: false

- name: Read the layers of the image just built
  ansible.builtin.command: docker image inspect --format '{{ '{{' }}json .RootFS.Layers{{ '}}' }}' palier:local
  register: palier_image_after
  changed_when: palier_image_after.stdout != palier_image_before.stdout

- name: Start Palier and its bench services
  ansible.builtin.command: "{{ palier_compose }} up -d --wait"
  register: palier_up
  until: palier_up.rc == 0
  retries: 3
  delay: 30
  changed_when: palier_up.stderr is search('Recreate|Creat|Start')
