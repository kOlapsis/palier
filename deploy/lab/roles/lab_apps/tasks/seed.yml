---
- name: Seed Outline
  when: "'outline' in topology.apps"
  block:
    - name: Wait for Outline to finish its migrations
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ topology.ports.outline }}/_health"
      register: outline_health
      until: outline_health.status == 200
      retries: 60
      delay: 5

    - name: Write three documents into the Outline database
      ansible.builtin.command: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U outline -d outline
      args:
        chdir: /apps/outline
        stdin: "{{ lookup('ansible.builtin.file', 'seed-outline.sql') }}"
      register: outline_seed
      changed_when: "'INSERT 0 1' in outline_seed.stdout or 'INSERT 0 3' in outline_seed.stdout"

- name: Seed Immich
  when: "'immich' in topology.apps"
  block:
    - name: Wait for Immich
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ topology.ports.immich }}/"
      register: immich_ping
      until: immich_ping.status == 200
      retries: 60
      delay: 5

    - name: Create the Immich administrator
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ topology.ports.immich }}/api/auth/admin-sign-up"
        method: POST
        body_format: json
        body:
          email: "{{ immich_admin_email }}"
          password: "{{ immich_admin_password }}"
          name: Lab admin
        status_code: [201, 400]
      register: immich_signup
      changed_when: immich_signup.status == 201

    - name: Sign in to Immich
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ topology.ports.immich }}/api/auth/login"
        method: POST
        body_format: json
        body:
          email: "{{ immich_admin_email }}"
          password: "{{ immich_admin_password }}"
        status_code: [200, 201]
      register: immich_login
      no_log: true

    - name: Seed photos into a fresh Immich
      when: immich_signup.status == 201
      block:
        - name: Copy the photos of the seed
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "/apps/immich/{{ item }}"
            mode: "0644"
          loop: [lab-photo-1.png, lab-photo-2.png, lab-photo-3.png]

        - name: Upload three photos
          ansible.builtin.command: >-
            curl -sf -H "Authorization: Bearer {{ immich_login.json.accessToken }}"
            -F assetData=@/apps/immich/{{ item }} -F deviceAssetId={{ item }} -F deviceId=palier-lab
            -F fileCreatedAt=2026-10-01T12:00:00.000Z -F fileModifiedAt=2026-10-01T12:00:00.000Z
            http://127.0.0.1:{{ topology.ports.immich }}/api/asset/upload
          loop: [lab-photo-1.png, lab-photo-2.png, lab-photo-3.png]
          register: immich_upload
          changed_when: "'created' in immich_upload.stdout"
          no_log: true

- name: Seed GitLab
  when: "'gitlab' in topology.apps"
  block:
    - name: Look for the GitLab seed marker
      ansible.builtin.stat:
        path: /apps/gitlab/data/.lab-seeded
      register: gitlab_seeded

    - name: Seed GitLab once
      when: not gitlab_seeded.stat.exists
      block:
        - name: Wait for GitLab to be ready
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ topology.ports.gitlab }}/-/readiness"
          register: gitlab_ready
          until: gitlab_ready.status == 200
          retries: 120
          delay: 10

        - name: Copy the seed script
          ansible.builtin.copy:
            src: seed-gitlab.rb
            dest: /apps/gitlab/config/seed-gitlab.rb
            mode: "0644"

        - name: Create a project with an issue
          ansible.builtin.command: docker compose exec -T gitlab gitlab-rails runner /etc/gitlab/seed-gitlab.rb
          args:
            chdir: /apps/gitlab
          changed_when: true

        - name: Mark GitLab as seeded
          ansible.builtin.file:
            path: /apps/gitlab/data/.lab-seeded
            state: touch
            mode: "0644"
