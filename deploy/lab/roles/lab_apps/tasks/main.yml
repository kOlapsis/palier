---
- name: Remove the stacks and their data
  when: lab_apps_reset | bool
  block:
    - name: Stop the stacks
      ansible.builtin.command: docker compose --project-name {{ item }} down --volumes --remove-orphans
      loop: "{{ topology.apps }}"
      changed_when: true

    - name: Remove the containers started outside Compose
      ansible.builtin.command: docker rm -f lab-observed lab-republished
      changed_when: true

    - name: Delete the stack directories
      ansible.builtin.file:
        path: "/apps/{{ item }}"
        state: absent
      loop: "{{ topology.apps }}"

- name: Create the stack directories
  ansible.builtin.file:
    path: "/apps/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ topology.apps }}"

- name: Write the stacks
  ansible.builtin.template:
    src: "{{ item.1.src }}"
    dest: "/apps/{{ item.0.name }}/{{ item.1.dest }}"
    mode: "0644"
    force: "{{ lab_apps_reset | bool }}"
  loop: "{{ lab_apps_files | selectattr('name', 'in', topology.apps) | subelements('files') }}"
  loop_control:
    label: "/apps/{{ item.0.name }}/{{ item.1.dest }}"

- name: Start the stacks
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "/apps/{{ item }}"
  loop: "{{ topology.apps }}"
  register: lab_apps_up
  until: lab_apps_up.rc == 0
  retries: 3
  delay: 30
  changed_when: lab_apps_up.stderr is search('Creat|Start')

- name: Pull the content of the republished tag
  ansible.builtin.command: docker pull {{ republished.image }}:{{ republished.content }}
  changed_when: false

- name: Give it the tag it stands for
  ansible.builtin.command: docker tag {{ republished.image }}:{{ republished.content }} {{ republished.image }}:{{ republished.tag }}
  changed_when: false

- name: Start the containers outside Compose
  ansible.builtin.command: docker run -d --name {{ item.name }} --restart unless-stopped {{ item.image }}
  loop:
    - {name: lab-observed, image: "{{ observed.image }}"}
    - {name: lab-republished, image: "{{ republished.image }}:{{ republished.tag }}"}
  register: lab_outside
  changed_when: lab_outside.rc == 0
  failed_when: lab_outside.rc != 0 and 'already in use' not in lab_outside.stderr

- name: Seed the stacks
  ansible.builtin.include_tasks: seed.yml
