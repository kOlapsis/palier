---
# The versions the stacks start from, and what each one is meant to show in
# Palier. `lab reset-apps` brings them back to these versions.

nginx:
  image: docker.io/library/nginx
  tag: 1.27.0
  why: >-
    One container, no data, a patch and minor release every few weeks, and
    no HEALTHCHECK in the image: Palier verifies it with what Docker gives,
    running and stable.

whoami:
  image: docker.io/traefik/whoami
  tag: v1.10.1
  why: >-
    One container that answers HTTP, with a few releases a year: the
    smallest upgrade Palier can apply and verify.

outline:
  image: docker.io/outlinewiki/outline
  tag: 1.10.1
  postgres_image: docker.io/library/postgres:16.4
  redis_image: docker.io/library/redis:7.2.4
  why: >-
    An application with a database: Outline migrates its PostgreSQL schema
    when it starts, so its minor releases (1.11.0, 1.12.0) change data and
    a rollback is not guaranteed without a backup. PostgreSQL 16.4 is behind
    on its own 16.x line; the catalog card (catalog/cards/postgresql.json)
    marks the rollback of a major upgrade as conditional on a pg_dumpall
    backup.

gitlab:
  image: docker.io/gitlab/gitlab-ce
  tag: 16.1.6-ce.0
  why: >-
    Required upgrade stops (https://docs.gitlab.com/update/upgrade_paths/):
    from 16.1 the path to the current release goes through 16.3.9, 16.7.10,
    16.11.10, 17.1.8, 17.3.7, 17.5.5, 17.8.7, 17.11.7, then the 18.x stops
    (18.2, 18.5, 18.8, 18.11), and 16.1.8 and 16.2.11 for some instances
    (NPM packages, large pipeline variable history). Palier must refuse a
    direct jump, compute the path from its GitLab card and show each stop
    with its background migrations gate.

immich:
  tag: v1.105.1
  postgres_image: registry.hub.docker.com/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
  redis_image: registry.hub.docker.com/library/redis:6.2-alpine@sha256:84882e87b54734154586e5f8abd4dce69fe7311315e2fc6d67c29614c8de2672
  why: >-
    Last release before the Compose breaking changes of v1.106
    (https://github.com/immich-app/immich/releases/tag/v1.106.1): the
    immich-microservices container is removed, `command: ['start.sh', 'immich']`
    goes away, SERVER_PORT, MICROSERVICES_PORT and MACHINE_LEARNING_PORT become
    IMMICH_PORT, HOST and MACHINE_LEARNING_HOST become IMMICH_HOST. Later,
    v1.133.0 (https://github.com/immich-app/immich/releases/tag/v1.133.0)
    replaces the tensorchord/pgvecto-rs database image with
    ghcr.io/immich-app/postgres (VectorChord), drops the database `command:`
    and healthcheck, and only supports upgrading from 1.107.2 or later.
    Palier must confront these changes with the compose file in service.

vaultwarden:
  image: docker.io/vaultwarden/server
  tag: 1.37.2
  why: >-
    One container on SQLite with a HEALTHCHECK in the image, and only patch
    releases ahead (1.37.3, 1.37.4), each with real release notes: the stack
    PALIER_AUTO=patch may apply without a click. Its backup hook
    (palier.hook.backup) copies the database first. nginx carries a backup
    hook that writes to /backup, which is not mounted, so it always fails and
    nothing is applied to nginx.
observed:
  image: ghcr.io/tarampampam/webhook-tester:2.2
  why: >-
    Started with docker run, outside Compose: a stack Palier only observes.
    The tag 2.2 moves with each 2.2.x release, so Palier must read the
    version in service from the digest (2.2.7), on GHCR.

republished:
  image: ghcr.io/tarampampam/webhook-tester
  content: 2.2.7
  tag: 2.3.0
  why: >-
    The content of 2.2.7 under the tag 2.3.0, started outside Compose: the
    registry serves another content for 2.3.0, as after a republished tag.
    Palier must keep 2.3.0 as the version in service and not propose 2.3.0
    again.
