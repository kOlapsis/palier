site_name: Palier
site_description: Docker Compose stack updates in steps, with a restore point and rollback.
docs_dir: docs
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Try a local model: local-model.md
  - How it works: how-it-works.md
  - Limitations: limitations.md
exclude_docs: |
  compose.yaml
