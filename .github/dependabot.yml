version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: docker/compose-bin
        update-types: [version-update:semver-major]
